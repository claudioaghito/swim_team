<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad-fase-altro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C8896"/>
      <stop offset="100%" stop-color="#5F6B76"/>
