{% extends "base.html" %}
{% block title %}Programma {{ gara.nome }}{% endblock %}
{% block content %}
<div class="actions">
    <a class="btn" href="{{ torna_url }}">&larr; Torna indietro</a>
    <a class="btn" href="{{ url_for('admin.programma_gara', gara_id=gara.id) }}">{{ icon('download') }} Scarica</a>
</div>
<div class="card">
    <h3>Programma gare — {{ gara.nome }}</h3>
    <div id="pdf-container"><p>Caricamento del PDF...</p></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="{{ static_url('js/pdf_viewer.js') }}"></script>
    <script>
        var url = {{ url_for('admin.programma_gara', gara_id=gara.id)|tojson }};
        mostraPdf(document.getElementById("pdf-container"), url, url);
    </script>
</div>
{% endblock %}
