{% extends "base.html" %}
{% block title %}Nuovo Messaggio{% endblock %}
{% block content %}
<div class="actions">
    <a class="btn" href="{{ url_for('admin.dashboard') }}">&larr; Home</a>
    <a class="btn" href="{{ url_for('admin.lista_messaggi') }}">{{ icon('messaggio') }} Tutti i messaggi</a>
</div>
<div class="card">
    <h2>{{ icon('nuovo-messaggio') }} Nuovo messaggio</h2>
    <form method="POST" enctype="multipart/form-data">
        <label>Destinatario</label>
        <select name="destinatario_id">
            <option value="">Tutta la squadra (comunicazione generale)</option>
            {% for a in atleti %}
                <option value="{{ a.id }}">{{ a.nome_completo }}</option>
            {% endfor %}
        </select>

        <label>Testo</label>
        <textarea name="testo" rows="4" required></textarea>

        <label>Allegati (PDF o immagini, facoltativi)</label>
        <input type="file" id="allegati-input" name="allegati" accept=".pdf,.png,.jpg,.jpeg,.gif,.webp" multiple>
        <ul id="allegati-elenco"></ul>

        <button type="submit">{{ icon('invio-messaggio') }} Invia</button>
    </form>
</div>
<script>
    document.getElementById("allegati-input").addEventListener("change", function () {
        var elenco = document.getElementById("allegati-elenco");
        elenco.innerHTML = "";
        Array.prototype.forEach.call(this.files, function (file) {
            var li = document.createElement("li");
            li.textContent = file.name;
            elenco.appendChild(li);
        });
    });
</script>
{% endblock %}
