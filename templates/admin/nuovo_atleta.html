{% extends "base.html" %}
{% block title %}Nuovo Atleta{% endblock %}
{% block content %}
<div class="actions">
    <a class="btn" href="{{ url_for('admin.lista_atleti') }}">&larr; Atleti</a>
</div>
<div class="card">
    <h2>Nuovo utente</h2>
    <form method="POST" enctype="multipart/form-data">
        <label>Nome</label>
        <input type="text" name="nome" required>

        <label>Cognome</label>
        <input type="text" name="cognome" required>

        <label>Data di nascita</label>
        <input type="date" name="data_nascita">

        <label>Sesso</label>
        <select name="sesso" required>
            <option value="" selected disabled>-- seleziona --</option>
            <option value="M">Maschio</option>
            <option value="F">Femmina</option>
        </select>

        <label>Nome utente</label>
        <input type="text" name="username" required>

        <label>Password</label>
        <div class="password-field">
            <input type="password" name="password" required>
            <button type="button" class="password-toggle" aria-label="Mostra password" title="Mostra password">
                <svg class="eye-icon eye-open" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="eye-icon eye-closed" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a21.6 21.6 0 0 1 5.06-6.06M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 7 11 7a21.6 21.6 0 0 1-2.66 3.79M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
        </div>

        <label>Email (opzionale)</label>
        <input type="email" name="email">

        <label>Ruolo</label>
        <select name="ruolo">
            <option value="atleta" selected>Atleta</option>
            <option value="admin">Amministratore</option>
        </select>

        <label>Cartellino (immagine, opzionale)</label>
        <input type="file" name="cartellino" accept=".png,.jpg,.jpeg,.gif,.webp">

        <label>Certificato medico (PDF o immagine, opzionale)</label>
        <input type="file" name="certificato_medico" accept=".pdf,.png,.jpg,.jpeg,.gif,.webp">

        <label>Scadenza certificato medico</label>
        <input type="date" name="certificato_medico_scadenza">

        <button type="submit">{{ icon('crea-atleta') }} Crea utente</button>
    </form>
</div>
{% endblock %}
