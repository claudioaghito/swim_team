{% extends "base.html" %}
{% block title %}Nuovo Movimento{% endblock %}
{% block content %}
<div class="actions">
    <a class="btn" href="{{ url_for('admin.lista_movimenti') }}">&larr; Movimenti contabili</a>
</div>
<div class="card">
    <h2>Nuovo movimento contabile</h2>
    <form method="POST">
        <label>Atleta</label>
        <select name="atleta_id" required>
            {% for a in atleti %}
                <option value="{{ a.id }}">{{ a.nome_completo }}</option>
            {% endfor %}
        </select>

        <label>Importo (€) — usa il segno meno per un addebito, es. -25.00</label>
        <input type="number" step="0.01" name="importo" required>

        <label>Causale</label>
        <input type="text" name="causale" placeholder="es. Quota gara regionale" required>

        <button type="submit" title="Registra movimento">{{ icon('salva') }}</button>
    </form>
</div>
{% endblock %}
