{% extends "base.html" %}
{% block title %}Modifica credenziali{% endblock %}
{% block content %}
<div class="actions">
    <a class="btn" href="{{ url_for('admin.dashboard') }}">&larr; Home</a>
</div>
<div class="card">
    <h2>{{ icon('modifica-credenziali') }} Modifica credenziali di accesso</h2>
    <form method="POST">
        <label>Nome</label>
        <input type="text" name="nome" value="{{ current_user.nome }}" required>

        <label>Cognome</label>
        <input type="text" name="cognome" value="{{ current_user.cognome }}" required>

        <label>Nome utente</label>
        <input type="text" name="username" value="{{ current_user.username }}" required>

        <label>Nuova password (lascia vuoto per non modificarla)</label>
        <div class="password-field">
            <input type="password" name="nuova_password">
            <button type="button" class="password-toggle" aria-label="Mostra password" title="Mostra password">
                <svg class="eye-icon eye-open" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="eye-icon eye-closed" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a21.6 21.6 0 0 1 5.06-6.06M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 7 11 7a21.6 21.6 0 0 1-2.66 3.79M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
        </div>

        <label>Password attuale (obbligatoria per confermare le modifiche)</label>
        <div class="password-field">
            <input type="password" name="password_attuale" required>
            <button type="button" class="password-toggle" aria-label="Mostra password" title="Mostra password">
                <svg class="eye-icon eye-open" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="eye-icon eye-closed" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a21.6 21.6 0 0 1 5.06-6.06M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 7 11 7a21.6 21.6 0 0 1-2.66 3.79M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
        </div>

        <button type="submit" title="Salva modifiche">{{ icon('salva') }}</button>
    </form>
</div>
{% endblock %}
