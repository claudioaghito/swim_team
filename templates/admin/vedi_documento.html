{% extends "base.html" %}
{% block title %}{{ titolo }}{% endblock %}
{% block content %}
<div class="actions">
    <a class="btn" href="{{ torna_url }}">&larr; Torna indietro</a>
    <a class="btn" href="{{ download_url }}">{{ icon('download') }} Scarica</a>
</div>
<div class="card">
    <h3>{{ titolo }}</h3>
    {% if is_immagine %}
        <img src="{{ view_url }}" alt="{{ titolo }}" style="max-width:100%;">
    {% else %}
        <div id="pdf-container"><p>Caricamento del PDF...</p></div>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
        <script>
            (function () {
                var url = {{ view_url|tojson }};
                var downloadUrl = {{ download_url|tojson }};
                var container = document.getElementById("pdf-container");

                function mostraErrore() {
                    container.innerHTML = "<p>Impossibile visualizzare l'anteprima del PDF in questa pagina. " +
                        "<a href=\"" + downloadUrl + "\">Scaricalo</a> per aprirlo.</p>";
                }

                if (!window.pdfjsLib) {
                    mostraErrore();
                    return;
                }
                pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

                function renderPagina(pdf, numeroPagina) {
                    return pdf.getPage(numeroPagina).then(function (pagina) {
                        var viewportBase = pagina.getViewport({ scale: 1 });
                        var scala = Math.min(2, container.clientWidth / viewportBase.width);
                        var viewport = pagina.getViewport({ scale: scala });

                        var canvas = document.createElement("canvas");
                        canvas.width = viewport.width;
                        canvas.height = viewport.height;
                        canvas.style.display = "block";
                        canvas.style.maxWidth = "100%";
                        canvas.style.marginBottom = "12px";
                        container.appendChild(canvas);

                        return pagina.render({ canvasContext: canvas.getContext("2d"), viewport: viewport }).promise;
                    });
                }

                pdfjsLib.getDocument(url).promise.then(function (pdf) {
                    container.innerHTML = "";
                    var catena = Promise.resolve();
                    for (var i = 1; i <= pdf.numPages; i++) {
                        (function (numeroPagina) {
                            catena = catena.then(function () { return renderPagina(pdf, numeroPagina); });
                        })(i);
                    }
                    catena.catch(mostraErrore);
                }).catch(mostraErrore);
            })();
        </script>
    {% endif %}
</div>
{% endblock %}
