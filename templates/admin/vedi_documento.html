{% extends "base.html" %}
{% block title %}{{ titolo }}{% endblock %}
{% block content %}
<div class="actions">
    <a class="btn" href="{{ torna_url }}">&larr; Torna indietro</a>
    <a class="btn" href="{{ download_url }}">{{ icon('download') }} Scarica</a>
</div>
<div class="card">
    <h3>{{ titolo }}</h3>
    {% if is_immagine %}
        <img src="{{ view_url }}" alt="{{ titolo }}" style="max-width:100%;">
    {% else %}
        <div id="pdf-container"><p>Caricamento del PDF...</p></div>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
        <script src="{{ static_url('js/pdf_viewer.js') }}"></script>
        <script>
            mostraPdf(document.getElementById("pdf-container"), {{ view_url|tojson }}, {{ download_url|tojson }});
        </script>
    {% endif %}
</div>
{% endblock %}
