{% extends "base.html" %}
{% block title %}{{ allegato.nome_visualizzato }}{% endblock %}
{% block content %}
<div class="actions">
    <a class="btn" href="{{ torna_url }}">&larr; Torna ai messaggi</a>
    <a class="btn" href="{{ url_for('admin.allegato_messaggio', messaggio_id=messaggio.id, allegato_id=allegato.id, download=1) }}">{{ icon('download') }} Scarica</a>
</div>
<div class="card">
    <h3>{{ allegato.nome_visualizzato }}</h3>
    {% if is_immagine %}
        <img src="{{ url_for('admin.allegato_messaggio', messaggio_id=messaggio.id, allegato_id=allegato.id) }}" alt="{{ allegato.nome_visualizzato }}" style="max-width:100%;">
    {% else %}
        <div id="pdf-container"><p>Caricamento del PDF...</p></div>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
        <script src="{{ static_url('js/pdf_viewer.js') }}"></script>
        <script>
            mostraPdf(
                document.getElementById("pdf-container"),
                {{ url_for('admin.allegato_messaggio', messaggio_id=messaggio.id, allegato_id=allegato.id)|tojson }},
                {{ url_for('admin.allegato_messaggio', messaggio_id=messaggio.id, allegato_id=allegato.id, download=1)|tojson }}
            );
        </script>
    {% endif %}
</div>
{% endblock %}
