{% extends "base.html" %}
{% block title %}{{ allegato.nome_visualizzato }}{% endblock %}
{% block content %}
<div class="actions">
    <a class="btn" href="{{ torna_url }}">&larr; Torna ai messaggi</a>
    <a class="btn" href="{{ url_for('admin.allegato_messaggio', messaggio_id=messaggio.id, allegato_id=allegato.id, download=1) }}">{{ icon('download') }} Scarica</a>
</div>
<div class="card">
    <h3>{{ allegato.nome_visualizzato }}</h3>
    {% if is_immagine %}
        <img src="{{ url_for('admin.allegato_messaggio', messaggio_id=messaggio.id, allegato_id=allegato.id) }}" alt="{{ allegato.nome_visualizzato }}" style="max-width:100%;">
    {% else %}
        <iframe src="{{ url_for('admin.allegato_messaggio', messaggio_id=messaggio.id, allegato_id=allegato.id) }}" title="{{ allegato.nome_visualizzato }}" style="width:100%;height:80vh;border:none;"></iframe>
    {% endif %}
</div>
{% endblock %}
